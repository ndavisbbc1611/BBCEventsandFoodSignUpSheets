<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements</title>
  <style>
    body {
      margin: 0;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px;
      box-sizing: border-box;
      font-family: sans-serif;
      color: #ccc;
    }
    img { max-width: 100%; height: auto; display: block; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .toolbar a {
      background: #2d6cdf;
      color: #fff;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 16px;
      text-decoration: none;
    }
    .toolbar a.secondary { background: #444; }
  </style>
</head>
<body>
  <img id="slide" alt="Announcements">
  <div class="toolbar" id="toolbar">
    <a id="pdf" href="announcements.pdf" target="_blank" rel="noopener">Open PDF to print</a>
    <a id="download" class="secondary" href="announcements.png" download="announcements.png">Download image</a>
  </div>
  <script>
    // Always load the newest files, so phones never show a cached old version
    var v = Date.now();
    var img = document.getElementById('slide');
    img.onerror = function () {
      document.getElementById('toolbar').style.display = 'none';
      img.outerHTML = '<p>Announcements are not available right now.</p>';
    };
    img.src = 'announcements.png?v=' + v;
    document.getElementById('pdf').href = 'announcements.pdf?v=' + v;
    document.getElementById('download').href = 'announcements.png?v=' + v;
  </script>
</body>
</html>
