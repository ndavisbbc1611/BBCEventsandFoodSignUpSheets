<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements</title>
  <style>
    body {
      margin: 0;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px;
      box-sizing: border-box;
      font-family: sans-serif;
      color: #ccc;
    }
    img { max-width: 100%; height: auto; display: block; }
    .toolbar { display: flex; gap: 12px; }
    .toolbar a, .toolbar button {
      background: #2d6cdf;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .toolbar a { background: #444; }

    /* Print: just the slide, filling one landscape page, no buttons */
    @page { size: landscape; margin: 0.25in; }
    @media print {
      body { background: #fff; display: block; min-height: 0; padding: 0; }
      .toolbar { display: none; }
      img { width: 100%; max-height: 100vh; object-fit: contain; }
    }
  </style>
</head>
<body>
  <img id="slide" alt="Announcements">
  <div class="toolbar" id="toolbar">
    <button onclick="window.print()">Print</button>
    <a id="download" href="announcements.png" download="announcements.png">Download image</a>
  </div>
  <script>
    // Always load the newest image, so phones never show a cached old one
    var v = Date.now();
    var img = document.getElementById('slide');
    img.onerror = function () {
      document.getElementById('toolbar').style.display = 'none';
      img.outerHTML = '<p>Announcements are not available right now.</p>';
    };
    img.src = 'announcements.png?v=' + v;
    document.getElementById('download').href = 'announcements.png?v=' + v;
  </script>
</body>
</html>
