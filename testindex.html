<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bible Baptist Church</title>
<style>
  :root {
    --bg: #F5F7FC;
    --ink: #1A1D2E;
    --blue: #1428D6;
    --blue-dark: #0E1C9E;
    --green: #4FCB1E;
    --line: #DCE1F2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 32px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-slot {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    padding: 16px;
  }
  .logo-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 30px;
    text-align: center;
    line-height: 1.25;
    color: var(--blue-dark);
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 16px;
    color: #7A6F5F;
    margin-bottom: 40px;
  }

  .menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 22px 22px;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--blue);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .card:active {
    transform: scale(0.98);
    box-shadow: none;
  }

  .icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #EAEEFA;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 22px; height: 22px; stroke: var(--blue-dark); }

  .card-text { flex: 1; min-width: 0; }

  .card-title {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .card-desc {
    font-size: 14px;
    color: #7A6F5F;
    line-height: 1.4;
  }

  .chevron {
    flex-shrink: 0;
    color: var(--green);
    font-size: 22px;
  }

  footer {
    margin-top: 44px;
    text-align: center;
    font-size: 13px;
    color: #A89B85;
  }
</style>
</head>

<script>
  const data = JSON.parse(document.getElementById('site-data').textContent);
  const menu = document.getElementById('menu');

  data.events.forEach((ev, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = ev.link;

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

    `;

    const textWrap = document.createElement('span');
    textWrap.className = 'card-text';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = ev.title;

    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = ev.description;

    textWrap.appendChild(title);
    textWrap.appendChild(desc);

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '\u203A';

    a.appendChild(icon);
    a.appendChild(textWrap);
    a.appendChild(chevron);
    menu.appendChild(a);
  });
</script>
