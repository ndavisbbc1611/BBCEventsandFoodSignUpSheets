<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Sign-Up</title>
  <style>
    body {
      margin: 0;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 12px;
      box-sizing: border-box;
      font-family: sans-serif;
      color: #ccc;
    }
    #viewer {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #viewer canvas {
      width: 100%;
      height: auto;
      background: #fff;
      display: block;
    }
    #msg { text-align: center; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .toolbar a {
      background: #2d6cdf;
      color: #fff;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 16px;
      text-decoration: none;
    }
    .toolbar a.secondary { background: #444; }
  </style>
</head>
<body>
  <div id="msg">Loading PDF…</div>
  <div id="viewer"></div>
  <div class="toolbar">
    <a id="openpdf" href="#" target="_blank" rel="noopener">Open PDF to print</a>
    <a id="download" class="secondary" href="#">Download PDF</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    var HUBSPOT_PDF_URL = "https://ndavisbbc1611.github.io/BBCEventsandFoodSignUpSheets/food-signup.pdf";
    var url = HUBSPOT_PDF_URL + "?v=" + Date.now();

    var msgEl = document.getElementById('msg');
    var viewerEl = document.getElementById('viewer');
    document.getElementById('openpdf').href = url;
    document.getElementById('download').href = url;

    if (typeof pdfjsLib === 'undefined') {
      msgEl.textContent = "Couldn't load the PDF viewer. Use the buttons below.";
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      pdfjsLib.getDocument(url).promise.then(function (pdf) {
        msgEl.style.display = 'none';
        var chain = Promise.resolve();
        for (let n = 1; n <= pdf.numPages; n++) {
          chain = chain.then(function () {
            return pdf.getPage(n).then(function (page) {
              var viewport = page.getViewport({ scale: 2 });
              var canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              viewerEl.appendChild(canvas);
              return page.render({
                canvasContext: canvas.getContext('2d'),
                viewport: viewport
              }).promise;
            });
          });
        }
      }).catch(function (err) {
        msgEl.style.display = '';
        msgEl.textContent = "Couldn't load the PDF. Use the buttons below.";
        console.error(err);
      });
    }
  </script>
</body>
</html>
